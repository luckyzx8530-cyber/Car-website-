<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HDMI Premium Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, #075cff55, transparent 35%),
        radial-gradient(circle at 80% 80%, #00aaff33, transparent 35%),
        #030814;
      color: white;
    }

    /* Background glow */
    body::before {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: #006eff;
      filter: blur(180px);
      opacity: 0.15;
    }

    .login-container {
      position: relative;
      width: 400px;
      padding: 42px 38px;
      border: 1px solid rgba(70, 150, 255, 0.35);
      border-radius: 24px;
      background: rgba(7, 18, 38, 0.78);
      backdrop-filter: blur(20px);
      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.55),
        0 0 45px rgba(0, 110, 255, 0.12);
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 20px;
      background: linear-gradient(145deg, #087cff, #0045b8);
      box-shadow:
        0 0 25px rgba(0, 119, 255, 0.55),
        inset 0 1px 1px rgba(255,255,255,0.3);
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .subtitle {
      text-align: center;
      color: #8ea7c9;
      font-size: 14px;
      margin-bottom: 32px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #b9cbe5;
      font-size: 13px;
      font-weight: 600;
    }

    .input-box {
      position: relative;
    }

    .input-box span {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #579cff;
      font-size: 18px;
    }

    input {
      width: 100%;
      padding: 14px 15px 14px 45px;
      border: 1px solid #1b385e;
      outline: none;
      border-radius: 12px;
      background: rgba(3, 12, 27, 0.8);
      color: white;
      font-size: 14px;
      transition: 0.3s;
    }

    input::placeholder {
      color: #58708f;
    }

    input:focus {
      border-color: #1681ff;
      box-shadow: 0 0 0 3px rgba(22, 129, 255, 0.12);
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 5px 0 25px;
      font-size: 12px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #8198b7;
    }

    .remember input {
      width: auto;
      accent-color: #1681ff;
    }

    .forgot {
      color: #4295ff;
      text-decoration: none;
    }

    .forgot:hover {
      text-decoration: underline;
    }

    .login-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, #087cff, #0052d6);
      box-shadow: 0 10px 25px rgba(0, 100, 255, 0.28);
      transition: 0.3s;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(0, 110, 255, 0.4);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 25px 0;
      color: #506783;
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: #18304e;
    }

    .signup {
      text-align: center;
      color: #7188a6;
      font-size: 13px;
    }

    .signup a {
      color: #3d94ff;
      text-decoration: none;
      font-weight: 600;
    }

    .signup a:hover {
      text-decoration: underline;
    }

    .brand {
      text-align: center;
      margin-top: 25px;
      font-size: 11px;
      color: #405875;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    @media (max-width: 480px) {
      .login-container {
        width: calc(100% - 30px);
        padding: 35px 25px;
      }
    }
  </style>
</head>

<body>

  <div class="login-container">

    <div class="logo">HDMI</div>

    <h1>Welcome Back</h1>
    <p class="subtitle">Sign in to your premium HDMI account</p>

    <form id="loginForm">

      <div class="input-group">
        <label for="email">Email Address</label>

        <div class="input-box">
          <span>✉</span>
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          >
        </div>
      </div>

      <div class="input-group">
        <label for="password">Password</label>

        <div class="input-box">
          <span>🔒</span>
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
          >
        </div>
      </div>

      <div class="options">
        <label class="remember">
          <input type="checkbox">
          Remember me
        </label>

        <a href="#" class="forgot">Forgot password?</a>
      </div>

      <button type="submit" class="login-btn">
        Sign In
      </button>

    </form>

    <div class="divider">OR</div>

    <div class="signup">
      Don't have an account?
      <a href="#">Create Account</a>
    </div>

    <div class="brand">
      Premium HDMI Experience
    </div>

  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      if (email && password) {
        alert("Login submitted successfully!");
      }
    });
  </script>

</body>
</html>
